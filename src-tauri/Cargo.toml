[package]
name = "voucherprov3"
version = "1.0.0"
description = "VoucherPRO Bradwell Pre-Printed Check Voucher System with QuickBooks SDK"
authors = ["Tetsuro"]
edition = "2021"

[lib]
name = "voucherprov3_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"

